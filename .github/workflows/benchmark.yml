name: Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Number of synthetic sales rows
        default: "2000000"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      USE_DELTA: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Show machine
        run: nproc && free -h
      - name: Run experiments
        run: PYTHONPATH=src python -m perf_lab.experiments --rows ${{ inputs.rows }} --out benchmark-results
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/